name: esp32_camera_app
description: "A Flutter app for viewing and controlling ESP32 camera with face detection."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  google_fonts: ^6.1.0
  google_mlkit_face_detection: ^0.11.0
  camera: ^0.10.5+5
  image: ^4.1.3
  http: ^1.2.0
  file_picker: ^8.0.0+1
  webview_flutter: ^4.8.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^5.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
